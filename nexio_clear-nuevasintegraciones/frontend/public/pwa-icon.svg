  <defs>
    <linearGradient id="zlG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#357a0e"/>
      <stop offset="100%" stop-color="#76e130"/>
    </linearGradient>
  </defs>
  <path d="M 26,6 H 74 Q 94,6 94,26 V 60 Q 94,80 74,80 H 44 L 22,95 L 26,80 Q 6,79 6,60 V 26 Q 6,6 26,6 Z" fill="url(#zlG)"/>
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="30" y1="28" x2="70" y2="28"/>
    <line x1="66" y1="31" x2="38" y2="55"/>
    <line x1="40" y1="58" x2="60" y2="58"/>
