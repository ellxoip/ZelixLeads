         seguían viendo el anterior — que es exactamente lo que pasó al pasar
         del logo de Nexio al de ZelixLeads. Subir este número es lo que
         obliga a bajarlo de nuevo; hay que subirlo cada vez que cambie. -->

    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
